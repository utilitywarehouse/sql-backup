version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - misspell
    - nakedret
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
    misspell:
      locale: UK
    nakedret:
      max-func-lines: 30
    staticcheck:
      # v2 merges gosimple (S) and stylecheck (ST) into staticcheck. v1 had
      # gosimple disabled and stylecheck not enabled, so keep only the SA checks.
      checks: ["all", "-S*", "-ST*"]

  exclusions:
    # v1 had exclude-use-default: false
    presets: []
    paths:
      - contract
      - '\.pb\.go'
    rules:
      # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
      - linters: [errcheck]
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked

      # gosec: Too many false-positives on 'unsafe' usage
      - linters: [gosec]
        text: Use of unsafe calls should be audited

      # gosec: Too many false-positives for parametrized shell calls
      - linters: [gosec]
        text: Subprocess launch(ed with variable|ing should be audited)

      # gosec: Duplicated errcheck checks
      - linters: [gosec]
        text: G104

      # gosec: Too many issues in popular repos
      - linters: [gosec]
        text: (Expect directory permissions to be 0750 or less|Expect file permissions to be 0600 or less)

      # gosec: False positive is triggered by 'src, err := ioutil.ReadFile(filename)'
      - linters: [gosec]
        text: Potential file inclusion via variable

      # govet: Common false positives
      - linters: [govet]
        text: (possible misuse of unsafe.Pointer|should have signature)

      # staticcheck: Developers tend to write in C-style with an explicit 'break' in a 'switch', so it's ok to ignore
      - linters: [staticcheck]
        text: ineffective break statement. Did you mean to break out of the outer loop

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
